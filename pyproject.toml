[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-layer-trading-system"
version = "0.1.0"
description = "Local-first multi-layer trading research and paper-trading system"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
]

[project.optional-dependencies]
ml = [
  "scikit-learn>=1.4",
  "xgboost>=2.0",
  "torch>=2.2",
  "transformers>=4.40",
]
broker = [
  "requests>=2.31",
  "MetaTrader5>=5.0; platform_system == 'Windows'",
]
dev = [
  "pytest>=8.0",
  "ruff>=0.5",
]

[project.scripts]
mlts = "trading_system.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
